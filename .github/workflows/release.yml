name: Publish Android release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch, tag, or commit from cumtfc/yingge-album-tv-android
        required: true
        default: main
        type: string
      version_name:
        description: Public version name, for example 1.1.0
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: string

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build, sign, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: release
      url: ${{ format('https://github.com/cumtfc/yingge-album-tv/releases/tag/v{0}', inputs.version_name) }}
    env:
      FNPHOTO_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      FNPHOTO_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      FNPHOTO_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cumtfc/yingge-album-tv-android
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Scan approved source
        run: ./scripts/check-sensitive.sh

      - name: Restore protected signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "The protected release keystore secret is missing." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/yingge-album-tv-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "FNPHOTO_RELEASE_STORE_FILE=$key_path" >> "$GITHUB_ENV"

      - name: Build and publish release
        run: |
          set -euo pipefail
          gh auth setup-git
          ./scripts/publish-release.sh \
            --release-repo cumtfc/yingge-album-tv \
            --version-name "${{ inputs.version_name }}" \
            --version-code "${{ inputs.version_code }}" \
            --no-pages \
            --publish
